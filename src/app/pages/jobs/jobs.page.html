<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>
      Trabajos Disponibles
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Trabajos Disponibles</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-searchbar 
    placeholder="Buscar trabajos..." 
    (ionInput)="filterJobs($event)"
    show-clear-button="focus">
  </ion-searchbar>

  <ion-list>
    <ion-card *ngFor="let job of filteredJobs" class="job-card">
      <ion-card-header>
        <ion-card-subtitle>{{ job.company_name || 'Empresa' }}</ion-card-subtitle>
        <ion-card-title>{{ job.titulo }}</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <div class="route-info">
          <ion-icon name="location-outline" color="primary"></ion-icon>
          <div class="route-text">
            <p><strong>Origen:</strong> {{ job.origen }}</p>
            <p><strong>Destino:</strong> {{ job.destino }}</p>
          </div>
        </div>

        <div class="job-details">
          <ion-chip color="secondary">
            <ion-icon name="cube-outline"></ion-icon>
            <ion-label>{{ job.tipo_carga }}</ion-label>
          </ion-chip>

          <ion-chip color="success">
            <ion-icon name="cash-outline"></ion-icon>
            <ion-label>{{ getPaymentText(job) }}</ion-label>
          </ion-chip>

          <ion-chip color="warning">
            <ion-icon name="scale-outline"></ion-icon>
            <ion-label>{{ job.peso }}kg</ion-label>
          </ion-chip>
        </div>

        <p class="description">{{ job.descripcion }}</p>

        <div class="action-buttons">
          <ion-button 
            fill="outline" 
            size="small" 
            (click)="viewJobDetails(job)">
            <ion-icon name="eye-outline" slot="start"></ion-icon>
            Ver Detalles
          </ion-button>

          <ion-button 
            color="primary" 
            size="small" 
            [disabled]="loadingState.isLoading"
            (click)="applyForJob(job)">
            <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
            Aplicar
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>

    <div *ngIf="filteredJobs.length === 0" class="no-jobs">
      <ion-icon name="briefcase-outline" size="large" color="medium"></ion-icon>
      <p>No se encontraron trabajos disponibles</p>
    </div>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="primary" (click)="refreshJobs()" [disabled]="loadingState.isLoading">
      <ion-icon name="refresh-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
